name: primer-recorrido
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_ci_only
          POSTGRES_DB: integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test_ci_only@localhost:5432/integration
      TEST_ALLOW_DB_WRITE: "true"
      DEMO_PASSWORD: Fiction-only-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Crear base E2E independiente
        run: node --input-type=module -e "import pg from 'pg'; const c = new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query('CREATE DATABASE e2e'); await c.end();"
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgres://test:test_ci_only@localhost:5432/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: "3002"
      COMPOSE_TEST_DB_PORT: "55433"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node scripts/setup-env.js
      - run: node --env-file=.env scripts/verify-compose.js --test
      - run: node --env-file=.env scripts/test-compose.js
      - run: node --env-file=.env scripts/verify-compose.js --test --restart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-results
          path: .local/compose-*.json
          retention-days: 7
      - name: Logs y parada conservando volúmenes
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail 100
          docker compose -f compose.yaml -f compose.test.yaml down
