name: primer-recorrido
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_V8_COVERAGE: ${{ github.workspace }}/.local/sprint02/jest-v8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sprint02/prepare-jest-database.js
      - name: Run suites and record evidence for the checked-out SHA
        run: node scripts/sprint02/record-tests.js
      - run: git rev-parse HEAD > coverage/jest/source-sha.txt
      - name: Coverage of executed Node tooling, with unexecuted files included
        run: node node_modules/c8/bin/c8.js report --all --temp-directory=.local/sprint02/jest-v8 --reports-dir=coverage/jest-tools --reporter=lcovonly --reporter=json-summary --include='server/**' --include='scripts/**' --include='*.js'
      - name: Coverage HTML and LCOV by tested SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/jest/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-tools-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/jest-tools/
          if-no-files-found: error
          retention-days: 14
  laboratory:
    uses: ./.github/workflows/sprint02-measurements.yml
  sonar:
    needs: [jest, laboratory]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: jest-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/jest
      - uses: actions/download-artifact@v4
        with:
          name: jest-tools-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/jest-tools
      - uses: actions/download-artifact@v4
        with:
          name: lab-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/lab
      - name: Require Sonar CI credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Import LCOV and evaluate existing Sonar gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Sonar analysis task identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task-${{ github.event.pull_request.head.sha || github.sha }}
          path: .scannerwork/report-task.txt
          if-no-files-found: error
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_ci_only
          POSTGRES_DB: integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d integration"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://test:test_ci_only@localhost:5432/integration
      TEST_ALLOW_DB_WRITE: "true"
      DEMO_PASSWORD: Fiction-only-2026!
      REDIS_URL: redis://127.0.0.1:6379
      PUBLIC_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - name: Backup snapshot comparator and failure guards
        run: python3 -m unittest discover -s tests/backup -v
      - run: npm run test:redis
      - run: npm run test:integration
      - run: npm run build
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Crear base E2E independiente
        run: node --input-type=module -e "import pg from 'pg'; const c = new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); await c.query('CREATE DATABASE e2e'); await c.end();"
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgres://test:test_ci_only@localhost:5432/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PORT: "3002"
      COMPOSE_TEST_DB_PORT: "55433"
      PUBLIC_BASE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: node scripts/setup-env.js
      - run: node --env-file=.env scripts/verify-compose.js --test
      - run: node --env-file=.env scripts/test-compose.js
      - run: node --env-file=.env scripts/verify-compose.js --test --restart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-results
          path: .local/compose-*.json
          retention-days: 7
      - name: Logs y parada conservando volúmenes
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail 100
          docker compose -f compose.yaml -f compose.test.yaml down
