name: logistics-issues
on:
  pull_request:
    paths: [.github/workflows/logistics-issues.yml]
permissions:
  contents: read
jobs:
  public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Leer JSON público de SonarCloud como datos
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://sonarcloud.io/api/issues/search?componentKeys=carlosgaraundo27-svg_Trazabilidad-Agricola-Arquitectura&pullRequest=7&resolved=false&ps=100'
          with urllib.request.urlopen(url, timeout=30) as response:
              result = json.load(response)
          keys = ['key','rule','type','severity','component','line','message']
          print(json.dumps({'total':result['total'],'issues':[{key:issue.get(key) for key in keys} for issue in result['issues']]}))
          PY
