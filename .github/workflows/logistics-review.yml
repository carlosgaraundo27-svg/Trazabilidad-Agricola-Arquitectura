name: logistics-review
on:
  pull_request:
    paths: [.github/workflows/logistics-review.yml]
permissions:
  contents: read
jobs:
  sonar-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hallazgos públicos del PR de Logística
        run: |
          curl --fail --retry 2 --max-time 30 'https://sonarcloud.io/api/issues/search?componentKeys=carlosgaraundo27-svg_Trazabilidad-Agricola-Arquitectura&pullRequest=7&resolved=false&ps=100' | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);console.log(JSON.stringify({total:j.total,issues:j.issues.map(({key,rule,type,severity,component,line,message})=>({key,rule,type,severity,component,line,message}))}));if(j.total>100)process.exitCode=1;});'
