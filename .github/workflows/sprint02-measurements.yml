name: sprint02-measurements
on:
  workflow_call:
permissions:
  contents: read
jobs:
  laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPRINT02_INDEPENDENT_HOST: "true"
      SPRINT02_DATABASE_URL: postgres://sprint02@127.0.0.1:55442/sprint02_lab
      SPRINT02_REDIS_URL: redis://127.0.0.1:56382
      SPRINT02_LOTS: "100"
      NODE_V8_COVERAGE: ${{ github.workspace }}/.local/sprint02/lab-v8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Isolated measurements and progressive load with stop conditions
        run: node scripts/sprint02/run-lab.js
      - name: Coverage from real laboratory execution, all production scripts included
        if: always()
        run: node node_modules/c8/bin/c8.js report --all --temp-directory=.local/sprint02/lab-v8 --reports-dir=coverage/lab --reporter=lcovonly --reporter=json-summary --include='server/**' --include='scripts/**' --include='*.js'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          path: coverage/lab/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve measurements including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint02-measurements-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .local/sprint02/*.json
            .local/sprint02/k6-*.log
          if-no-files-found: error
          retention-days: 30
      - name: Stop only this runner laboratory
        if: always()
        run: docker stop sprint02-lab-db-1 sprint02-lab-redis-1
