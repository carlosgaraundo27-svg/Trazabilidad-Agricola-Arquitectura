services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD en .env}
      POSTGRES_DB: trazabilidad
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U demo -d trazabilidad]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    command: [node, scripts/container-start.js]
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:${APP_PORT:-3000}
      DATABASE_URL: postgres://demo:${POSTGRES_PASSWORD}@db:5432/trazabilidad
      ALLOW_DEMO_SEED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Configure DEMO_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
volumes:
  pgdata:
